<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --surface-3: #e3e7ed;
  --border: rgba(0,0,0,0.07);
  --border-2: rgba(0,0,0,0.12);
  --primary: #6366f1;
  --primary-h: #4f46e5;
  --primary-dim: rgba(99,102,241,0.09);
  --green: #16a34a;
  --green-dim: rgba(22,163,74,0.09);
  --red: #dc2626;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --r: 12px;
  --r-sm: 8px;
}

html { color-scheme: light; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(245,246,248,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 60px;
  display: flex; align-items: center; gap: 12px;
}
.logo {
  font-size: 17px; font-weight: 700; letter-spacing: -0.4px;
  display: flex; align-items: center; gap: 9px;
}
.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 8px; display: grid; place-items: center; font-size: 15px;
  box-shadow: 0 2px 8px rgba(99,102,241,0.4);
}
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 15px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500; font-family: inherit;
  cursor: pointer; transition: all 0.15s; border: none; outline: none;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-h); }
.btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
.btn-danger:hover { background: rgba(239,68,68,0.08); }
.btn-rewatch { background: var(--primary-dim); color: var(--primary-h); border: 1px solid rgba(99,102,241,0.3); }
.btn-rewatch:hover { background: rgba(99,102,241,0.2); }
.btn-rewatch-stop { background: transparent; color: var(--primary-h); border: 1px solid rgba(99,102,241,0.3); }
.btn-rewatch-stop:hover { background: var(--primary-dim); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 5px; }

/* ── Filter bar ── */
.filters-bar {
  padding: 18px 24px 0;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.filter-tab {
  padding: 5px 14px; border-radius: 100px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-2); font-family: inherit;
}
.filter-tab:hover { background: var(--surface-2); color: var(--text); }
.filter-tab.active {
  background: var(--primary-dim);
  border-color: rgba(99,102,241,0.35);
  color: var(--primary-h);
}
.shows-count { margin-left: auto; font-size: 12px; color: var(--text-3); }

/* ── Grid ── */
.main { padding: 18px 24px 60px; }
.shows-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 14px;
}

/* ── Show card ── */
.show-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden; cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  position: relative;
}
.show-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--border-2); }
.show-card.done { border-color: rgba(34,197,94,0.22); }
.show-card.rewatching { border-color: rgba(99,102,241,0.28); }

.card-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: var(--surface-2); }
.card-poster-ph {
  width: 100%; aspect-ratio: 2/3; background: var(--surface-2);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--text-3); font-size: 36px;
}
.card-poster-ph small { font-size: 11px; text-align: center; padding: 0 12px; line-height: 1.4; color: var(--text-3); }
.card-body { padding: 11px 12px 12px; }
.card-title {
  font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-sub { font-size: 11px; color: var(--text-3); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
.dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: var(--green); }
.dot-gray { background: var(--text-3); }

.progress-bg { height: 3px; background: var(--surface-3); border-radius: 10px; overflow: hidden; margin-bottom: 5px; }
.progress-fill { height: 100%; border-radius: 10px; background: var(--primary); transition: width 0.4s ease; }
.progress-fill.done { background: var(--green); }
.progress-text { font-size: 11px; color: var(--text-3); display: flex; justify-content: space-between; }

.done-badge {
  position: absolute; top: 8px; right: 8px;
  background: var(--green); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 4px; letter-spacing: 0.3px;
}
.done-badge.rw { background: var(--primary); }

/* ── Empty state ── */
.empty { grid-column: 1/-1; text-align: center; padding: 80px 24px; color: var(--text-3); }
.empty-icon { font-size: 56px; margin-bottom: 16px; }
.empty h3 { font-size: 17px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
.empty p { font-size: 13px; line-height: 1.6; max-width: 260px; margin: 0 auto 20px; }

/* ── Search modal ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
  z-index: 100;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 72px 20px 20px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.modal-backdrop.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border: 1px solid var(--border-2); border-radius: 16px;
  width: 100%; max-width: 560px; box-shadow: 0 32px 80px rgba(0,0,0,0.7); overflow: hidden;
  transform: translateY(-10px) scale(0.99);
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal-backdrop.open .modal { transform: translateY(0) scale(1); }
.search-row {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.search-icon { font-size: 17px; color: var(--text-3); flex-shrink: 0; }
.search-input {
  flex: 1; background: none; border: none; outline: none;
  font-family: inherit; font-size: 15px; color: var(--text); caret-color: var(--primary);
}
.search-input::placeholder { color: var(--text-3); }
.esc-key {
  background: var(--surface-3); border: 1px solid var(--border-2);
  color: var(--text-3); font-size: 11px; font-weight: 500;
  padding: 2px 7px; border-radius: 4px; cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.esc-key:hover { background: var(--surface-2); color: var(--text-2); }
.search-results { max-height: 460px; overflow-y: auto; }
.search-hint { padding: 36px; text-align: center; color: var(--text-3); font-size: 13px; }
.result-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 18px; cursor: pointer; transition: background 0.12s;
  border-top: 1px solid var(--border);
}
.result-row:first-child { border-top: none; }
.result-row:hover { background: var(--surface-2); }
.result-poster { width: 42px; height: 60px; border-radius: 6px; object-fit: cover; background: var(--surface-3); flex-shrink: 0; }
.result-poster-ph { width: 42px; height: 60px; border-radius: 6px; background: var(--surface-3); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.result-info { flex: 1; min-width: 0; }
.result-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.result-meta { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
.result-genres { font-size: 11px; color: var(--text-3); }
.result-cta { flex-shrink: 0; }
.added-label { font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 3px; }

/* ── Detail panel ── */
.panel-overlay {
  position: fixed; inset: 0; z-index: 80;
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
}
.panel-overlay.open { opacity: 1; pointer-events: all; }
.panel-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(3px); }
.panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(560px, 100vw);
  background: var(--surface); border-left: 1px solid var(--border-2);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
.panel-overlay.open .panel { transform: translateX(0); }

.panel-head {
  display: flex; gap: 15px; padding: 18px 18px 16px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  background: var(--surface);
}
.panel-poster { width: 76px; height: 107px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex-shrink: 0; }
.panel-poster-ph { width: 76px; height: 107px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 28px; flex-shrink: 0; }
.panel-info { flex: 1; min-width: 0; }
.panel-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); margin-bottom: 5px; line-height: 1.2; }
.panel-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); margin-bottom: 6px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 100px; font-size: 10px; font-weight: 600; letter-spacing: 0.2px; }
.badge-run { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
.badge-end { background: var(--surface-3); color: var(--text-3); border: 1px solid var(--border-2); }

/* Watched progress */
.prog-label { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: var(--text-3); text-transform: uppercase; margin-bottom: 3px; margin-top: 6px; }
.panel-prog-bg { height: 4px; background: var(--surface-3); border-radius: 10px; overflow: hidden; margin-bottom: 3px; }
.panel-prog-fill { height: 100%; border-radius: 10px; background: var(--primary); transition: width 0.4s ease; }
.panel-prog-fill.done { background: var(--green); }
.panel-prog-text { font-size: 11px; color: var(--text-2); margin-bottom: 8px; }

/* Rewatch progress */
.rw-prog-bg { height: 4px; background: var(--primary-dim); border-radius: 10px; overflow: hidden; margin-bottom: 3px; margin-top: 2px; }
.rw-prog-fill { height: 100%; border-radius: 10px; background: var(--primary); transition: width 0.4s ease; }
.rw-prog-fill.done { background: var(--green); }
.rw-prog-text { font-size: 11px; color: var(--primary-h); margin-bottom: 8px; }
.rw-section { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
.rw-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  color: var(--primary-h); text-transform: uppercase; margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}

.panel-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.close-btn {
  background: var(--surface-2); border: 1px solid var(--border-2);
  color: var(--text-3); width: 30px; height: 30px;
  border-radius: 7px; display: grid; place-items: center;
  cursor: pointer; font-size: 14px; transition: all 0.15s;
  flex-shrink: 0; align-self: flex-start; margin-top: 1px;
}
.close-btn:hover { background: var(--surface-3); color: var(--text); }

/* ── Seasons ── */
.seasons-body { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.season-block { border-bottom: 1px solid var(--border); }
.season-hd {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 18px; cursor: pointer;
  user-select: none; transition: background 0.12s;
}
.season-hd:hover { background: var(--surface-2); }
.chev { font-size: 9px; color: var(--text-3); transition: transform 0.2s; flex-shrink: 0; }
.chev.open { transform: rotate(90deg); }
.season-label { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
.season-stat { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
.mark-btn {
  background: none; border: 1px solid var(--border-2);
  color: var(--text-3); font-size: 11px; font-family: inherit;
  padding: 3px 8px; border-radius: 4px;
  cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.mark-btn:hover { background: var(--green-dim); border-color: rgba(34,197,94,0.3); color: var(--green); }
.mark-btn.unmark:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); color: var(--red); }
.mark-btn.rw:hover { background: var(--primary-dim); border-color: rgba(99,102,241,0.3); color: var(--primary-h); }
.mark-btn.rw.unmark:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); color: var(--red); }

.eps-list { display: none; flex-direction: column; gap: 1px; padding: 4px 18px 8px; }
.eps-list.open { display: flex; }

/* ── Episode rows ── */
.ep-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 9px; border-radius: 7px;
  cursor: pointer; transition: background 0.12s;
  border: 1px solid transparent;
}
.ep-row:hover { background: var(--surface-2); }
.ep-row.watched { background: rgba(34,197,94,0.04); border-color: rgba(34,197,94,0.07); }
.ep-row.rewatched { background: rgba(99,102,241,0.05); border-color: rgba(99,102,241,0.1); }
.ep-row.rewatched.watched { background: rgba(99,102,241,0.05); border-color: rgba(99,102,241,0.1); }

/* Original-watch checkbox */
.ep-check {
  width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid var(--border-2);
  display: grid; place-items: center;
  flex-shrink: 0; transition: all 0.15s; font-size: 10px; color: #fff;
}
.ep-row.watched .ep-check { background: var(--green); border-color: var(--green); }

/* Rewatch checkbox (only shown in rewatch mode) */
.ep-rw-check {
  width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid rgba(99,102,241,0.35);
  display: grid; place-items: center;
  flex-shrink: 0; transition: all 0.15s; font-size: 10px; color: #fff;
}
.ep-row.rewatched .ep-rw-check { background: var(--primary); border-color: var(--primary); }

/* Original-watch indicator dot (shown when in rewatch mode) */
.ep-orig-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  transition: background 0.15s;
}
.ep-orig-dot.w { background: var(--green); }
.ep-orig-dot.nw { background: var(--surface-3); border: 1px solid var(--border-2); }

.ep-num { font-size: 11px; color: var(--text-3); min-width: 26px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.ep-name { font-size: 12px; color: var(--text-2); flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ep-row.watched .ep-name { color: var(--text-3); }
.ep-row.rewatched .ep-name { color: var(--text-3); }
.ep-date { font-size: 11px; color: var(--text-3); flex-shrink: 0; }

/* ── Misc ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 18px; height: 18px; border: 2px solid var(--surface-3); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
.spinner-lg { width: 24px; height: 24px; border-width: 2.5px; }
.load-center { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px; color: var(--text-3); font-size: 13px; }

/* ── Toast ── */
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: var(--surface-3); border: 1px solid var(--border-2); color: var(--text); font-size: 13px; font-weight: 500; padding: 9px 18px; border-radius: 100px; box-shadow: var(--shadow); opacity: 0; transform: translateY(6px); transition: all 0.22s ease; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { border-color: rgba(34,197,94,0.3); }
.toast.error { border-color: rgba(239,68,68,0.3); color: #fca5a5; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

/* ── Responsive ── */
@media (max-width: 600px) {
  .header, .filters-bar, .main { padding-left: 16px; padding-right: 16px; }
  .shows-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .panel { width: 100%; }
  .shows-count { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">TV Tracker</div>
  <div class="header-right">
    <button class="btn btn-primary" onclick="openSearch()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Show
    </button>
  </div>
</header>

<div class="filters-bar">
  <button class="filter-tab active" onclick="setFilter('all')" id="ft-all">All</button>
  <button class="filter-tab" onclick="setFilter('watching')" id="ft-watching">Watching</button>
  <button class="filter-tab" onclick="setFilter('plan')" id="ft-plan">Plan to Watch</button>
  <button class="filter-tab" onclick="setFilter('done')" id="ft-done">Completed</button>
  <span class="shows-count" id="count-label"></span>
</div>

<main class="main">
  <div class="shows-grid" id="grid">
    <div class="load-center" style="grid-column:1/-1">
      <div class="spinner spinner-lg"></div> Loading...
    </div>
  </div>
</main>

<!-- Search modal -->
<div class="modal-backdrop" id="search-modal" onclick="handleModalBg(event)">
  <div class="modal" role="dialog" aria-label="Search shows">
    <div class="search-row">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="text"
        placeholder="Search TV shows…" autocomplete="off" spellcheck="false"
        oninput="onSearchInput()">
      <button class="esc-key" onclick="closeSearch()">ESC</button>
    </div>
    <div class="search-results" id="search-results">
      <div class="search-hint">Start typing to find a show…</div>
    </div>
  </div>
</div>

<!-- Detail panel -->
<div class="panel-overlay" id="panel-overlay" onclick="handlePanelBg(event)">
  <div class="panel-backdrop"></div>
  <div class="panel" id="panel">
    <div class="panel-head" id="panel-head"></div>
    <div class="seasons-body" id="seasons-body">
      <div class="load-center"><div class="spinner"></div> Loading episodes…</div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
// ── State ──────────────────────────────────────────────────
let shows = [];
let filter = 'all';
let activeShow = null;
let epCache = {};
let openSeasons = new Set();
let adding = new Set();
let addedIds = new Set();
let searchTimer;

// ── Boot ───────────────────────────────────────────────────
async function init() { await loadShows(); }

async function loadShows() {
  try {
    const r = await fetch('/api/shows');
    const d = await r.json();
    shows = d.shows || [];
    addedIds = new Set(shows.map(s => s.tvmaze_id));
    renderGrid();
  } catch { toast('Failed to load', 'error'); }
}

// ── Filter ────────────────────────────────────────────────
function setFilter(f) {
  filter = f;
  ['all','watching','plan','done'].forEach(k =>
    document.getElementById('ft-' + k).classList.toggle('active', k === f));
  renderGrid();
}

function filtered() {
  return shows.filter(s => {
    const t = s.total_episodes, w = s.watched_count;
    if (filter === 'done')     return t > 0 && w === t;
    if (filter === 'watching') return w > 0 && w < t;
    if (filter === 'plan')     return w === 0;
    return true;
  });
}

// ── Render grid ───────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('grid');
  const list = filtered();
  document.getElementById('count-label').textContent =
    `${list.length} show${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    const msgs = {
      all:      ['No shows yet', 'Hit "Add Show" to start tracking your favourites.', true],
      watching: ['Nothing in progress', "Shows you've started appear here.", false],
      plan:     ['Watchlist empty', 'Add shows and they\'ll appear here.', false],
      done:     ['No completed shows', "Shows you've fully watched appear here.", false],
    };
    const [h, p, btn] = msgs[filter];
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">📺</div>
      <h3>${h}</h3><p>${p}</p>
      ${btn ? '<button class="btn btn-primary" onclick="openSearch()">➕ Add Show</button>' : ''}
    </div>`;
    return;
  }
  grid.innerHTML = list.map(cardHtml).join('');
}

function cardHtml(s) {
  const t = s.total_episodes || 0, w = s.watched_count || 0, rw = s.rewatch_count || 0;
  const isRw = !!s.is_rewatch;
  const done = t > 0 && w === t;
  const displayCount = isRw ? rw : w;
  const pct = t > 0 ? Math.round(displayCount / t * 100) : 0;
  const progDone = isRw ? (t > 0 && rw === t) : done;
  const genres = JSON.parse(s.genres || '[]').slice(0,2).join(' · ');
  const running = s.status === 'Running';
  const cardClass = isRw ? ' rewatching' : done ? ' done' : '';
  const badge = isRw
    ? '<div class="done-badge rw">↺ Rewatching</div>'
    : done ? '<div class="done-badge">✓ Done</div>' : '';
  return `<div class="show-card${cardClass}" onclick="openPanel(${s.id})">
    ${badge}
    ${s.image_url
      ? `<img class="card-poster" src="${esc(s.image_url)}" alt="${esc(s.name)}" loading="lazy">`
      : `<div class="card-poster-ph">📺<small>${esc(s.name)}</small></div>`}
    <div class="card-body">
      <div class="card-title">${esc(s.name)}</div>
      <div class="card-sub">
        <span class="dot ${running?'dot-green':'dot-gray'}"></span>
        ${s.premiere_year||''}${genres?` · ${esc(genres)}`:''}
      </div>
      <div class="progress-bg"><div class="progress-fill${progDone?' done':''}" style="width:${pct}%"></div></div>
      <div class="progress-text">
        <span>${isRw ? `${rw}/${t} rewatched` : `${w}/${t} eps`}</span>
        <span>${pct}%</span>
      </div>
    </div>
  </div>`;
}

// ── Detail panel ──────────────────────────────────────────
async function openPanel(showId) {
  activeShow = shows.find(s => s.id === showId);
  if (!activeShow) return;
  openSeasons = new Set();

  document.getElementById('panel-overlay').classList.add('open');
  renderPanelHead(activeShow);
  document.getElementById('seasons-body').innerHTML =
    '<div class="load-center"><div class="spinner"></div> Loading episodes…</div>';

  if (!epCache[showId]) {
    try {
      const r = await fetch(`/api/shows/${showId}/episodes`);
      const d = await r.json();
      epCache[showId] = d.episodes || [];
    } catch {
      document.getElementById('seasons-body').innerHTML =
        '<div class="load-center" style="color:var(--red)">Failed to load episodes</div>';
      return;
    }
  }
  renderSeasons();
}

function renderPanelHead(s) {
  const t = s.total_episodes||0, w = s.watched_count||0, rw = s.rewatch_count||0;
  const isRw = !!s.is_rewatch;
  const pct  = t>0?Math.round(w/t*100):0;
  const done = t>0&&w===t;
  const rwPct  = t>0?Math.round(rw/t*100):0;
  const rwDone = t>0&&rw===t;
  const running = s.status==='Running';
  const genres = JSON.parse(s.genres||'[]');

  document.getElementById('panel-head').innerHTML = `
    ${s.image_url
      ? `<img class="panel-poster" src="${esc(s.image_url)}" alt="${esc(s.name)}">`
      : '<div class="panel-poster-ph">📺</div>'}
    <div class="panel-info">
      <div class="panel-title">${esc(s.name)}</div>
      <div class="panel-meta">
        <span class="badge ${running?'badge-run':'badge-end'}">${running?'● Running':'● Ended'}</span>
        ${s.premiere_year?`<span>${s.premiere_year}</span>`:''}
        ${s.network?`<span>· ${esc(s.network)}</span>`:''}
      </div>
      ${genres.length?`<div class="panel-meta">${genres.map(esc).join(' · ')}</div>`:''}
      <div class="prog-label">Watched</div>
      <div class="panel-prog-bg"><div class="panel-prog-fill${done?' done':''}" id="ppfill" style="width:${pct}%"></div></div>
      <div class="panel-prog-text" id="pptext">${w} of ${t} episodes · ${pct}%</div>
      ${isRw ? `
        <div class="rw-section">
          <div class="rw-section-label">↺ Rewatch</div>
          <div class="rw-prog-bg"><div class="rw-prog-fill${rwDone?' done':''}" id="rwfill" style="width:${rwPct}%"></div></div>
          <div class="rw-prog-text" id="rwtext">${rw} of ${t} episodes · ${rwPct}%</div>
        </div>` : ''}
      <div class="panel-actions">
        ${isRw
          ? `<button class="btn btn-rewatch-stop btn-sm" onclick="toggleRewatch(${s.id},true)">Stop Rewatch</button>`
          : `<button class="btn btn-rewatch btn-sm" onclick="toggleRewatch(${s.id},false)">↺ Start Rewatch</button>`}
        <button class="btn btn-danger btn-sm" onclick="removeShow(${s.id})">Remove</button>
      </div>
    </div>
    <button class="close-btn" onclick="closePanel()">✕</button>`;
}

function renderSeasons() {
  const eps = epCache[activeShow.id] || [];
  const isRw = !!activeShow.is_rewatch;

  if (!eps.length) {
    document.getElementById('seasons-body').innerHTML =
      '<div class="load-center" style="color:var(--text-3)">No episodes found</div>';
    return;
  }

  const seasons = {};
  for (const ep of eps) (seasons[ep.season] = seasons[ep.season]||[]).push(ep);

  let html = '';
  for (const [sn, list] of Object.entries(seasons)) {
    const sNum = parseInt(sn);
    const wCount  = list.filter(e => e.watched).length;
    const rwCount = list.filter(e => e.rewatched).length;
    const total   = list.length;
    const isOpen  = openSeasons.has(sNum);

    // In rewatch mode: stat and button use rewatch counts
    const statCount  = isRw ? rwCount : wCount;
    const allDone    = isRw ? rwCount === total : wCount === total;
    const markLabel  = isRw
      ? (allDone ? 'Unmark ↺' : 'Mark ↺')
      : (allDone ? 'Unmark all' : 'Mark all');
    const markClass  = `mark-btn${isRw?' rw':''}${allDone?' unmark':''}`;
    const markClick  = isRw
      ? `toggleSeasonRewatch(${sNum},${allDone})`
      : `toggleSeasonAll(${sNum},${allDone})`;

    html += `<div class="season-block">
      <div class="season-hd" onclick="toggleSeason(${sNum})">
        <span class="chev${isOpen?' open':''}">▶</span>
        <span class="season-label">Season ${sNum}</span>
        <span class="season-stat">${statCount}/${total}</span>
        <button class="${markClass}" onclick="event.stopPropagation();${markClick}">${markLabel}</button>
      </div>
      <div class="eps-list${isOpen?' open':''}" id="eps-s${sNum}">
        ${list.map(ep => epHtml(ep, isRw)).join('')}
      </div>
    </div>`;
  }
  document.getElementById('seasons-body').innerHTML = html;
}

function epHtml(ep, isRw) {
  const date = ep.air_date
    ? new Date(ep.air_date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
  const num = `E${String(ep.episode_number).padStart(2,'0')}`;
  const name = esc(ep.name || 'Episode ' + ep.episode_number);

  if (isRw) {
    // Rewatch mode: show original-watch dot + rewatch checkbox
    const rwClass = ep.rewatched ? ' rewatched' : '';
    const origDot = `<span class="ep-orig-dot ${ep.watched?'w':'nw'}" title="${ep.watched?'Originally watched':'Not yet watched'}"></span>`;
    return `<div class="ep-row${rwClass}" id="ep${ep.id}" onclick="toggleEpRewatch(${ep.id})">
      ${origDot}
      <div class="ep-rw-check">${ep.rewatched?'↺':''}</div>
      <span class="ep-num">${num}</span>
      <span class="ep-name">${name}</span>
      <span class="ep-date">${date}</span>
    </div>`;
  }

  // Normal mode: standard watched checkbox
  return `<div class="ep-row${ep.watched?' watched':''}" id="ep${ep.id}" onclick="toggleEp(${ep.id})">
    <div class="ep-check">${ep.watched?'✓':''}</div>
    <span class="ep-num">${num}</span>
    <span class="ep-name">${name}</span>
    <span class="ep-date">${date}</span>
  </div>`;
}

function toggleSeason(sNum) {
  openSeasons.has(sNum) ? openSeasons.delete(sNum) : openSeasons.add(sNum);
  const open = openSeasons.has(sNum);
  document.getElementById('eps-s'+sNum)?.classList.toggle('open', open);
  document.getElementById('eps-s'+sNum)?.previousElementSibling?.querySelector('.chev')?.classList.toggle('open', open);
}

// ── Watched toggle ────────────────────────────────────────
async function toggleEp(epId) {
  const ep = epCache[activeShow.id]?.find(e => e.id === epId);
  if (!ep) return;
  const was = !!ep.watched;
  ep.watched = !was;
  refreshEpRow(ep);
  refreshSeasonBar(ep.season);
  refreshPanelProg();
  try {
    await fetch(`/api/episodes/${epId}/watch`, { method: was?'DELETE':'POST' });
    await syncShowStats(activeShow.id);
  } catch {
    ep.watched = was;
    refreshEpRow(ep); refreshSeasonBar(ep.season); refreshPanelProg();
    toast('Update failed', 'error');
  }
}

async function toggleSeasonAll(sNum, wasAll) {
  const eps = epCache[activeShow.id]?.filter(e => e.season === sNum) || [];
  for (const ep of eps) ep.watched = !wasAll;
  for (const ep of eps) refreshEpRow(ep);
  refreshSeasonBar(sNum);
  refreshPanelProg();
  try {
    await fetch(`/api/shows/${activeShow.id}/watch-season/${sNum}`, { method: wasAll?'DELETE':'POST' });
    await syncShowStats(activeShow.id);
  } catch {
    for (const ep of eps) { ep.watched = wasAll; refreshEpRow(ep); }
    refreshSeasonBar(sNum); refreshPanelProg();
    toast('Update failed', 'error');
  }
}

// ── Rewatch toggle ────────────────────────────────────────
async function toggleRewatch(showId, isCurrentlyRw) {
  try {
    await fetch(`/api/shows/${showId}/rewatch`, { method: isCurrentlyRw?'DELETE':'POST' });
    toast(isCurrentlyRw ? 'Rewatch stopped' : '↺ Rewatch mode on!', isCurrentlyRw?'':'success');
  } catch {
    toast('Failed', 'error'); return;
  }
  // Reload episodes cache to pick up rewatched field
  delete epCache[showId];
  const [statsReq, epsReq] = await Promise.all([
    fetch('/api/shows'),
    fetch(`/api/shows/${showId}/episodes`)
  ]);
  const statsD = await statsReq.json();
  const epsD   = await epsReq.json();
  shows = statsD.shows || [];
  addedIds = new Set(shows.map(s => s.tvmaze_id));
  epCache[showId] = epsD.episodes || [];
  activeShow = shows.find(s => s.id === showId) || activeShow;
  renderGrid();
  renderPanelHead(activeShow);
  renderSeasons();
}

async function toggleEpRewatch(epId) {
  const ep = epCache[activeShow.id]?.find(e => e.id === epId);
  if (!ep) return;
  const was = !!ep.rewatched;
  ep.rewatched = !was;
  refreshEpRow(ep);
  refreshSeasonBar(ep.season);
  refreshRwProg();
  try {
    await fetch(`/api/episodes/${epId}/rewatch`, { method: was?'DELETE':'POST' });
    await syncShowStats(activeShow.id);
  } catch {
    ep.rewatched = was;
    refreshEpRow(ep); refreshSeasonBar(ep.season); refreshRwProg();
    toast('Update failed', 'error');
  }
}

async function toggleSeasonRewatch(sNum, wasAll) {
  const eps = epCache[activeShow.id]?.filter(e => e.season === sNum) || [];
  for (const ep of eps) ep.rewatched = !wasAll;
  for (const ep of eps) refreshEpRow(ep);
  refreshSeasonBar(sNum);
  refreshRwProg();
  try {
    await fetch(`/api/shows/${activeShow.id}/rewatch-season/${sNum}`, { method: wasAll?'DELETE':'POST' });
    await syncShowStats(activeShow.id);
  } catch {
    for (const ep of eps) { ep.rewatched = wasAll; refreshEpRow(ep); }
    refreshSeasonBar(sNum); refreshRwProg();
    toast('Update failed', 'error');
  }
  refreshSeasonBar(sNum);
}

// ── Refresh helpers ───────────────────────────────────────
function refreshEpRow(ep) {
  const row = document.getElementById('ep'+ep.id);
  if (!row) return;
  const isRw = !!activeShow?.is_rewatch;
  if (isRw) {
    row.className = `ep-row${ep.rewatched?' rewatched':''}`;
    const check = row.querySelector('.ep-rw-check');
    if (check) check.textContent = ep.rewatched ? '↺' : '';
    const dot = row.querySelector('.ep-orig-dot');
    if (dot) { dot.className = `ep-orig-dot ${ep.watched?'w':'nw'}`; }
  } else {
    row.className = `ep-row${ep.watched?' watched':''}`;
    const check = row.querySelector('.ep-check');
    if (check) check.textContent = ep.watched ? '✓' : '';
  }
}

function refreshSeasonBar(sNum) {
  const eps = epCache[activeShow.id]?.filter(e => e.season === sNum) || [];
  const t = eps.length;
  const isRw = !!activeShow?.is_rewatch;
  const count = isRw ? eps.filter(e => e.rewatched).length : eps.filter(e => e.watched).length;
  const allDone = count === t;
  const hd = document.getElementById('eps-s'+sNum)?.previousElementSibling;
  if (!hd) return;
  hd.querySelector('.season-stat').textContent = `${count}/${t}`;
  const btn = hd.querySelector('.mark-btn');
  btn.textContent = isRw ? (allDone?'Unmark ↺':'Mark ↺') : (allDone?'Unmark all':'Mark all');
  btn.className = `mark-btn${isRw?' rw':''}${allDone?' unmark':''}`;
  btn.onclick = e => {
    e.stopPropagation();
    isRw ? toggleSeasonRewatch(sNum, allDone) : toggleSeasonAll(sNum, allDone);
  };
}

function refreshPanelProg() {
  const eps = epCache[activeShow.id] || [];
  const t = eps.length, w = eps.filter(e => e.watched).length;
  const pct = t>0?Math.round(w/t*100):0, done = t>0&&w===t;
  const fill = document.getElementById('ppfill');
  const text = document.getElementById('pptext');
  if (fill) { fill.style.width=pct+'%'; fill.className=`panel-prog-fill${done?' done':''}`; }
  if (text) text.textContent = `${w} of ${t} episodes · ${pct}%`;
}

function refreshRwProg() {
  const eps = epCache[activeShow.id] || [];
  const t = eps.length, rw = eps.filter(e => e.rewatched).length;
  const pct = t>0?Math.round(rw/t*100):0, done = t>0&&rw===t;
  const fill = document.getElementById('rwfill');
  const text = document.getElementById('rwtext');
  if (fill) { fill.style.width=pct+'%'; fill.className=`rw-prog-fill${done?' done':''}`; }
  if (text) text.textContent = `${rw} of ${t} episodes · ${pct}%`;
}

async function syncShowStats(showId) {
  const r = await fetch('/api/shows');
  const d = await r.json();
  shows = d.shows || [];
  addedIds = new Set(shows.map(s => s.tvmaze_id));
  const updated = shows.find(s => s.id === showId);
  if (updated && activeShow?.id === showId) activeShow = updated;
  renderGrid();
}

function closePanel() {
  document.getElementById('panel-overlay').classList.remove('open');
  activeShow = null;
}
function handlePanelBg(e) {
  if (e.target.classList.contains('panel-overlay') || e.target.classList.contains('panel-backdrop')) closePanel();
}

async function removeShow(showId) {
  if (!confirm('Remove this show?')) return;
  try {
    await fetch(`/api/shows/${showId}`, { method: 'DELETE' });
    delete epCache[showId];
    shows = shows.filter(s => s.id !== showId);
    addedIds = new Set(shows.map(s => s.tvmaze_id));
    renderGrid();
    closePanel();
    toast('Show removed');
  } catch { toast('Failed to remove', 'error'); }
}

// ── Search ────────────────────────────────────────────────
function openSearch() {
  document.getElementById('search-modal').classList.add('open');
  document.getElementById('search-results').innerHTML = '<div class="search-hint">Start typing to find a show…</div>';
  document.getElementById('search-input').value = '';
  setTimeout(() => document.getElementById('search-input').focus(), 80);
}
function closeSearch() {
  document.getElementById('search-modal').classList.remove('open');
  clearTimeout(searchTimer);
}
function handleModalBg(e) {
  if (e.target === document.getElementById('search-modal')) closeSearch();
}
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = document.getElementById('search-input').value.trim();
  if (!q) {
    document.getElementById('search-results').innerHTML = '<div class="search-hint">Start typing to find a show…</div>';
    return;
  }
  document.getElementById('search-results').innerHTML =
    '<div class="load-center"><div class="spinner"></div> Searching…</div>';
  searchTimer = setTimeout(() => doSearch(q), 320);
}
async function doSearch(q) {
  try {
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const d = await r.json();
    renderSearchResults(d.results || []);
  } catch {
    document.getElementById('search-results').innerHTML =
      '<div class="search-hint" style="color:var(--red)">Search failed — try again</div>';
  }
}
function renderSearchResults(results) {
  const el = document.getElementById('search-results');
  if (!results.length) {
    el.innerHTML = '<div class="search-hint">No shows found. Try a different search.</div>';
    return;
  }
  el.innerHTML = results.map(({ show }) => {
    const isAdded = addedIds.has(show.id);
    const isAdding = adding.has(show.id);
    const genres = (show.genres||[]).slice(0,3).join(', ');
    const year = show.premiered?.slice(0,4) || '';
    const running = show.status === 'Running';
    return `<div class="result-row" id="res${show.id}">
      ${show.image?.medium
        ? `<img class="result-poster" src="${esc(show.image.medium)}" alt="${esc(show.name)}" loading="lazy">`
        : '<div class="result-poster-ph">📺</div>'}
      <div class="result-info">
        <div class="result-name">${esc(show.name)}</div>
        <div class="result-meta">
          ${running?'<span style="color:var(--green)">● Running</span>':show.status||''}
          ${year?`<span>${year}</span>`:''}
          ${show.network?.name?`<span>· ${esc(show.network.name)}</span>`:''}
        </div>
        ${genres?`<div class="result-genres">${esc(genres)}</div>`:''}
      </div>
      <div class="result-cta" id="cta${show.id}">
        ${isAdded
          ? '<span class="added-label">✓ Added</span>'
          : isAdding
            ? '<div class="spinner"></div>'
            : `<button class="btn btn-primary btn-xs" onclick="addShow(${show.id},event)">Add</button>`}
      </div>
    </div>`;
  }).join('');
}
async function addShow(tvmazeId, e) {
  if (e) e.stopPropagation();
  adding.add(tvmazeId);
  const cta = document.getElementById('cta'+tvmazeId);
  if (cta) cta.innerHTML = '<div class="spinner"></div>';
  try {
    const r = await fetch('/api/shows', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tvmazeId })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    adding.delete(tvmazeId);
    addedIds.add(tvmazeId);
    await loadShows();
    if (cta) cta.innerHTML = '<span class="added-label">✓ Added</span>';
    toast('Show added!', 'success');
  } catch (err) {
    adding.delete(tvmazeId);
    const msg = err.message === 'Already added' ? 'Already in your list' : 'Failed to add';
    if (cta) cta.innerHTML = `<button class="btn btn-primary btn-xs" onclick="addShow(${tvmazeId},event)">Retry</button>`;
    toast(msg, 'error');
  }
}

// ── Toast ─────────────────────────────────────────────────
function toast(msg, type = '') {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast${type?' '+type:''}`;
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2600);
}

// ── Utils ─────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('search-modal').classList.contains('open')) closeSearch();
    else if (document.getElementById('panel-overlay').classList.contains('open')) closePanel();
  }
});

init();
</script>
</body>
</html>
